
client:
  connection-provider-name: junit2-provider
  max-connections: 500
  request-timeout-millis: 30_000
  response-timeout-millis: 50_000
  num-retries: 3
  retry-wait-millis: 100
  token-config:
    token-url: http://localhost:1080/auth/token
    form-data:
      grant-type: client_credentials
      scope: myScope
      username: myusername
  paths:
    path1:
      path: /path
      scope: scope

