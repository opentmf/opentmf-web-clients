
client:
  connection-provider-name: openid-mtls-provider
  max-connections: 500
  request-timeout-millis: 30_000
  response-timeout-millis: 50_000
  num-retries: 3
  retry-wait-millis: 100
  fixed-headers:
    x-country-code: TR
    x-route-info: CatSync
    x-source-system: Dsync
  token-config:
    use-mock: false
    token-url: http://localhost:1080/auth/token
    form-data:
      grant-type: client_credentials
      scope: myScope
      username: myusername
  paths:
    path1:
      path: /path
      scope: scope
  certificates:
    key-store:
      password: mypassword
      pk-password: mypassword
      base64-jks: 
    trust-store:
      password: mypassword
      pk-password: mypassword
      base64-jks: 
